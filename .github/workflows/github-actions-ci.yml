name: Run CI
on: [push, pull_request]

jobs:
  CI:
    # ℹ️ Available GitHub Actions Runner Images 
    #    https://github.com/actions/runner-images
    runs-on: macos-15
    env:
      DEVICE_NAME: iPhone 16 Pro

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: recursive

      - name: Verify Yoga revisions match
        shell: bash
        run: |
          yoga_revision=$(git -C ThirdParty/yoga rev-parse HEAD)
          grep -F "revision: \"$yoga_revision\"" Package.swift
          grep -F "revision = $yoga_revision;" FlexLayout.xcodeproj/project.pbxproj
          grep -F "\"revision\": \"$yoga_revision\"" Package.resolved

      - run: pod install --repo-update

      - name: Set Xcode Version 16.4.0
        run: sudo xcode-select -s /Applications/Xcode_16.4.0.app

      - name: fastlane
        run: set -o pipefail && fastlane travis

      - run: bash <(curl -s https://codecov.io/bash) -J 'FlexLayout' -J 'FlexLayoutTests'

      - run: echo "🍏 This job's status is ${{ job.status }}."
